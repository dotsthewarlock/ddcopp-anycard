<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>AnyCard Link Generator</title>
  <style>
    body { margin:0; font-family:Arial,sans-serif; background:#0b1020; color:white; }
    .wrap { display:flex; height:100vh; }
    .left { width:380px; padding:16px; background:#111827; box-sizing:border-box; }
    .right { flex:1; padding:24px; }
    textarea { width:100%; height:260px; background:#020617; color:#22c55e; border:1px solid #374151; padding:10px; box-sizing:border-box; }
    button { padding:10px 14px; margin:10px 0; cursor:pointer; background:#4f46e5; color:white; border:0; border-radius:6px; font-weight:bold; }
    .card { padding:10px; margin:8px 0; background:#1f2937; border:1px solid #374151; border-radius:6px; cursor:pointer; }
    .card:hover { background:#312e81; }
    .small { color:#9ca3af; font-size:13px; }
    a { color:#93c5fd; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="left">
      <h2>AnyCard</h2>
      <div class="small">Paste card number + PIN, one per line</div>

      <textarea id="rawData">1249991753102417018 8104</textarea>

      <button id="generateBtn">Generate Links</button>

      <h3>Generated Links</h3>
      <div id="linksContainer" class="small">No links yet.</div>
    </div>

    <div class="right">
      <h1>Workspace</h1>
      <p>Click a generated card on the left. It will open AnyCard in a new tab.</p>
      <p id="status" class="small">Waiting...</p>
    </div>
  </div>

  <script>
    document.getElementById("generateBtn").addEventListener("click", function () {
      const raw = document.getElementById("rawData").value.trim();
      const box = document.getElementById("linksContainer");
      const status = document.getElementById("status");

      box.innerHTML = "";

      if (!raw) {
        box.textContent = "No data pasted.";
        return;
      }

      const lines = raw.split(/\n+/);
      let count = 0;

      lines.forEach(function(line) {
        const parts = line.trim().split(/\s+/);
        if (parts.length < 2) return;

        const code = parts[0];
        const pin = parts[1];

        const url =
          "https://anycard.ca/swap/loadcard?code=" +
          encodeURIComponent(code) +
          "&pin=" +
          encodeURIComponent(pin);

        const div = document.createElement("div");
        div.className = "card";
        div.innerHTML = "<strong>" + code + "</strong><br>PIN: " + pin;

        div.addEventListener("click", function () {
          status.innerHTML = 'Opened: <a href="' + url + '" target="_blank">' + url + "</a>";
          window.open(url, "_blank");
        });

        box.appendChild(div);
        count++;
      });

      if (count === 0) {
        box.textContent = "No valid card/PIN lines found.";
      } else {
        status.textContent = count + " links generated.";
      }
    });
  </script>
</body>
</html>
